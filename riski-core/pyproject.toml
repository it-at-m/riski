[project]
name = "core"
version = "0.1.6"
description = "Riski core for shared functionality like data model, db access, etc."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "sqlalchemy>=2.0.42",
    "sqlmodel>=0.0.24",
    "psycopg[binary,pool]>=3.2.9",
    "pydantic[email]>=2.11.7",
    "pydantic-settings==2.15.0",
    "pgvector<0.4",
    "langchain-openai==1.7.1",
    "truststore>=0.10.4",
    "langchain-core==1.6.10",
    "langsmith==0.8.18",
]

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"
