[project]
name = "riski-backend"
license = "MIT"
version = "0.5.19"
description = "Python backend for finding information in munich's political information system RIS"
readme = "README.md"
requires-python = "==3.13.14"
authors = [
    { name = "Fabian Reinold", email = "fabian.reinold@muenchen.de" },
    { name = "Stefan Hentschel", email = "stefan.hentschel@muenchen.de" },
    { name = "Annalena Wittmann", email = "annalena.wittmann@muenchen.de" },
    { name = "Tim-Luca Pfeifer", email = "tim-luca.pfeifer@muenchen.de" },
    { name = "Michael Jaumann", email = "michael.jaumann@muenchen.de" },
]
maintainers = [
    { name = "Stefan Hentschel", email = "stefan.hentschel@muenchen.de" },
]

dependencies = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "cryptography==50.0.2",
    "pydantic-settings==2.15.0",
    "pydantic==2.13.5",
    "python-dotenv==1.2.4",
    "truststore==0.10.4",
    "ag-ui-langgraph==0.0.46",
    "pyyaml==6.0.3",
    "langfuse==3.15.0",
    "core",
    "langchain-postgres==0.0.18",
    "langchain-openai==1.6.7",
    "langchain-core==1.6.6",
    "langchain==1.4.3",
    "langgraph==1.2.12",
    "langgraph-prebuilt==1.1.0",
    "langgraph-checkpoint==4.2.0",
    "langgraph-checkpoint-redis==0.5.2",
]

[dependency-groups]
dev = [
    "pre-commit==4.6.2",
    "pytest-asyncio==1.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-env==1.7.1",
    "ruff==0.16.10",
    "ty==0.0.84",
]

[tool.uv.sources]
core = { path = "../riski-core" }

[tool.uv]
add-bounds = "exact"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
asyncio_mode = "auto"
addopts = ["--cov=app", "--cov-report=term-missing"]

[tool.pytest_env]
RISKI_ENABLE_DOCS = "false"
OPENAI_API_KEY = "test-key"
RISKI__DB__PASSWORD = "pw"
SSL_CERT_FILE = ""
REQUESTS_CA_BUNDLE = ""
RISKI__CONFIG = ""
